services:
  # Main media server
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    ports:
      - "8096:8096"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - /mnt/media:/media
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.movies.simandoff.space
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8096/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Netflix-style UI for movies/TV
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    ports:
      - "5055:5055"
    environment:
      - JELLYFIN_URL=http://jellyfin:8096
      - LOG_LEVEL=debug
    depends_on:
      jellyfin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5055/api/v1/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - /mnt/config/jellyseerr:/app/config

  # Torrent client + media management
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    ports:
      - "6881:6881"
      - "6881:6881/udp"
      - "8081:8080"
    volumes:
      - qbittorrent_config:/config
      - ./config/qbittorrent/init-whitelist.sh:/custom-cont-init.d/init-whitelist.sh:ro
      - /mnt/media/torrents:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Sofia
      - WEBUI_PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v2/app/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Automatic TV show management
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    ports:
      - "8989:8989"
    volumes:
      - sonarr_config:/config
      - /mnt/media/tv:/tv
      - /mnt/media/torrents:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Sofia
      - SONARR__AUTH__APIKEY=${SONARR_API_KEY}
      - SONARR__AUTH__METHOD=Forms
    depends_on:
      qbittorrent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8989/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Automatic movie management
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    ports:
      - "7878:7878"
    volumes:
      - radarr_config:/config
      - /mnt/media/movies:/movies
      - /mnt/media/torrents:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Sofia
      - RADARR__AUTH__APIKEY=${RADARR_API_KEY}
      - RADARR__AUTH__METHOD=Forms
    depends_on:
      qbittorrent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7878/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Search indexer aggregator
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    ports:
      - "9696:9696"
    volumes:
      - prowlarr_config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Sofia
      - PROWLARR__AUTH__APIKEY=${PROWLARR_API_KEY}
      - PROWLARR__AUTH__METHOD=Forms
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9696/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Subtitle management
  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    ports:
      - "6767:6767"
    volumes:
      - bazarr_config:/config
      - /mnt/media/movies:/movies
      - /mnt/media/tv:/tv
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Sofia
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: wires Sonarr/Radarr/Prowlarr/qBittorrent/Jellyseerr together on every deploy
  init-config:
    image: curlimages/curl:8.10.1
    container_name: init-config
    entrypoint: ["/bin/sh", "/init/wire-config.sh"]
    volumes:
      - ./init/wire-config.sh:/init/wire-config.sh:ro
    environment:
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY}
      - JELLYFIN_ADMIN_USER=${JELLYFIN_ADMIN_USER}
      - JELLYFIN_ADMIN_PASSWORD=${JELLYFIN_ADMIN_PASSWORD}
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
      jellyseerr:
        condition: service_healthy
    restart: "no"

volumes:
  jellyfin_config:
  jellyfin_cache:
  qbittorrent_config:
  sonarr_config:
  radarr_config:
  prowlarr_config:
  bazarr_config:
